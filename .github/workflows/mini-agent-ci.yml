name: Chinese course and Mini Agent M0

on:
  pull_request:
    paths:
      - "textbook/**"
      - "product/**"
      - "docs/**"
      - ".github/workflows/mini-agent-ci.yml"
  push:
    paths:
      - "textbook/**"
      - "product/**"
      - "docs/**"
      - ".github/workflows/mini-agent-ci.yml"

jobs:
  backend-and-lessons:
    name: Python lessons and backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install teaching environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r textbook/examples/requirements.txt
          python -m pip install -r product/backend/requirements.txt
      - name: Python syntax
        run: python -m compileall -q textbook/examples product/backend
      - name: LangGraph offline exercises
        run: |
          python textbook/examples/01_first_graph.py
          python textbook/examples/02_conditional_loop.py
          python textbook/examples/03_reducer.py
      - name: Policy and backend unit tests
        run: |
          python -m pytest textbook/examples/test_sync_result.py product/backend/tests -q

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: product/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm install
      - name: Build frontend
        run: npm run build

# 外部模型调用需要真实密钥与费用，因此 CI 故意不运行 LLM 示例。
# 此 CI 不声明已完成产品级安全隔离或重启恢复测试。
